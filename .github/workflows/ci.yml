name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # CPU-only PyTorch keeps the install small; the tests never need a GPU.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app]"
      # No CMU data or trained checkpoint in CI: tests use synthetic typists and
      # skip the few checks that need checkpoints/model.pt.
      - name: Test
        run: python -m pytest -q

  # Builds the Docker image and smoke-tests it, so a broken Dockerfile fails the PR.
  # No model is mounted, so /health must report model_loaded: false.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tempo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name tempo -p 8000:8000 tempo:ci
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/health | grep -q '"model_loaded":false'
          curl -fsS http://127.0.0.1:8000/ | grep -q "Tempo demo"
          docker inspect --format '{{.Config.User}}' tempo | grep -qx tempo
      # Validates docker-compose.yml (no model, no build). A dummy key stands in for the real one in .env.
      - name: Validate docker-compose.yml
        run: |
          TEMPO_TOKEN_KEY=dummy-key-for-ci-only-dummy-key-for-ci-only docker compose --profile train config --quiet
          if env -u TEMPO_TOKEN_KEY docker compose config --quiet 2>/dev/null; then
            echo "compose must refuse to start without TEMPO_TOKEN_KEY"
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker logs tempo || true
