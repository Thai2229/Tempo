[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyauth"
version = "0.1.0"
description = "Log in by the rhythm of your typing: keystroke-dynamics biometrics with PyTorch"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
